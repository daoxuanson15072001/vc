        cards: [6ab4ba0fb1c921b0a784dc0d, 6ab4ba4ab1c921b0a784dc21, 6ab4ba29b1c921b0a784dc18]
      - title: Gặp khách lần đầu
        cards: [6ab4baa0b1c921b0a784dc39, 6ab4b978b1c921b0a784dbe9]
  - week: 2
    title: Chuẩn bị & khai thác nhu cầu
    lessons:
      - title: Chuẩn bị cuộc gặp
        cards: [6ab4ba40b1c921b0a784dc1f, 6ab4b9dab1c921b0a784dc01]
      - title: Hỏi để hiểu khách
        cards: [6ab4b9a8b1c921b0a784dbf4, 6ab4b9beb1c921b0a784dbfa]
  - week: 3
    title: Báo giá, phản đối, chốt
    lessons:
      - title: Trả lời hỏi giá & phản đối
        cards: [6ab4b9c3b1c921b0a784dbfb, 6ab4ba12b1c921b0a784dc0f]
      - title: Chốt đơn
        cards: [6ab4ba4cb1c921b0a784dc22, 6ab4b975b1c921b0a784dbe7]
  - week: 4
    title: Giữ giá & chăm sóc
    lessons:
      - title: Giữ giá
        cards: [6ab4ba5ab1c921b0a784dc23, 6ab4b98ab1c921b0a784dbed]
