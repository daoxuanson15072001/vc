# Khoá đào tạo mẫu cho /learn — yêu cầu 6ab889cd…9949de mục 1 (anh Thọ Anh chốt 16 thẻ, 27/09/2026).
# Đọc bởi backend/app/learn/sample.py (script: backend/scripts/seed_sample_course.py). Idempotent theo sample_key.
# Đổi danh sách thẻ = đổi khoá: tăng sample_key (nvkd-b2b-v2) rồi chạy seed --reset nếu muốn thay bản cũ.

sample_key: nvkd-b2b-v1
title: Kỹ năng bán hàng B2B cho NVKD mới
description: >-
  Khoá mẫu 4 tuần cho nhân viên kinh doanh VCpart mới (cấp bậc 2, mảng Bán hàng). Sau 4 tuần bạn tự lên kế hoạch
  cuộc gặp khách và xử lý 3 dạng từ chối phổ biến của chủ gara. Khoảng 3 giờ mỗi tuần: đọc bài, luyện tập, cuối khoá
  thi 15 câu trắc nghiệm + 2 câu tự luận tình huống gara (30 phút, đạt từ 70%).
learner: nhân viên kinh doanh mới bán phụ tùng ô tô cho chủ gara   # người đọc phần diễn giải bài (AI)
audience:
  function: kinh-doanh
  level: 2
  category: bh
  division: [vcpart, tap-doan]
hours_per_week: 3
enroll_days: 28            # hạn = ngày giao / tự ghi danh + 28 ngày, 23:59 giờ VN
require_org_space: true     # yêu cầu 9949de: 16 thẻ phải ở kho org
org_space: Kho video TikTok  # 16 thẻ + bài học + câu hỏi nằm ở kho org này (nhân viên nào cũng xem được)
questions_per_card: 2

weeks:
  - week: 1
    title: Tư thế & tiếp cận
    lessons:
