# Máy dev có Docker: Keycloak (start-dev) + PostgreSQL, thay cho scripts/kc-local.sh; MongoDB replica set và
# VC Home API ở cổng 3100 (GĐ B). Chỉ chạy Keycloak: docker compose -f compose.dev.yml up -d keycloak
#   docker compose -f compose.dev.yml up -d
#   source scripts/dev-env.sh && pnpm realm:apply:dev && pnpm e2e
# Keycloak dùng mạng của máy (network_mode: host) để địa chỉ giống nhau ở trình duyệt và trong Keycloak:
# realm vc gọi Google giả ở http://localhost:8180, gửi thông báo đăng xuất tới app mẫu ở http://localhost:4400.
# Cần Linux, hoặc Docker Desktop đã bật host networking; không được thì dùng scripts/kc-local.sh.
name: vc-platform-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak-dev-only
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.5}
    command: ["start-dev", "--http-port=8180", "--http-management-port=9100"]
    network_mode: host
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://127.0.0.1:5433/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-dev-only
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
      # Sửa theme thấy ngay, không cần khởi động lại.
      KC_SPI_THEME__CACHE_THEMES: "false"
      KC_SPI_THEME__CACHE_TEMPLATES: "false"
      VCHOME_URL: http://localhost:5173
      TZ: Asia/Ho_Chi_Minh
    volumes: [./keycloak/themes/vc:/opt/keycloak/themes/vc:ro]

  # MongoDB 7, replica set một node (transaction cần replica set). Healthcheck khởi tạo rs0 ở lần chạy đầu.
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip", "127.0.0.1", "--port", "27017", "--setParameter", "transactionLifetimeLimitSeconds=120"]
    network_mode: host
    volumes: [mongodata-dev:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args: { NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine}" }
    image: vc-api:dev
    network_mode: host
    depends_on: { mongo: { condition: service_healthy } }
    environment:
      APP_ENV: dev
      PORT: "3100"
      MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MONGO_DB: vchome
      OIDC_ISSUER: http://localhost:8180/realms/vc
      KC_BASE_URL: http://localhost:8180
      KC_ADMIN_CLIENT_SECRET: dev-vchome-api-secret
      LOG_LEVEL: info

volumes:
  pgdata-dev:
  mongodata-dev:
