# apps/web/nginx.conf for the host network: listen on :8090 (LAN, http://192.168.1.129:8090) and serve the
# Cloudflare tunnel too; api on 127.0.0.1:3100 (3000 and 8080 are taken here).

# Client address handed to the api, which trusts CF-Connecting-IP from 127.0.0.1 (db/tenant-context.ts):
# only cloudflared on this machine (loopback) may pass the visitor's address through; a LAN browser always
# gets its own socket address, so nobody on the LAN can pick the address the audit log records.
map $remote_addr $vclinks_client_ip {
  127.0.0.1 $http_cf_connecting_ip;
  default   $remote_addr;
}

server {
  listen 8090;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Relative redirects (/privacy -> /privacy/): behind the Cloudflare tunnel an absolute one would point at
  # http://<host>:8090/, which is not reachable from the internet.
  absolute_redirect off;

  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $vclinks_client_ip;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # MCP uses Streamable HTTP (SSE responses): disable buffering.
  location /mcp {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_set_header CF-Connecting-IP $vclinks_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
